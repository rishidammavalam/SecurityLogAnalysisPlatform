<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width-device-width, initial scale=1.0">
    <title>Security Log Analysis Platform</title>
</head>
<body>
    <h1>Security Log Analysis Platform</h1>
    <p>Upload and analyze security logs for suspicious activity.</p>

    <form action="/upload" method="POST" enctype="multipart/form-data">
        <input type="file" name="log_file" accept=".log,.txt">
        <button type="submit">Upload log</button>
    </form>
</body>
</html>
